name: Publicar reglas firmadas
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión entera mayor que la última publicada
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: publish-rules
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Verificar versión, firmar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.RULES_SIGNING_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[1-9][0-9]{0,8}$ ]] || { echo 'Versión inválida'; exit 1; }
          previous=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sed -n 's/^rules-v//p' | sort -nr | head -1)
          test "$VERSION" -gt "${previous:-0}" || { echo 'La versión debe ser mayor'; exit 1; }
          test -n "$SIGNING_KEY"
          umask 077
          key="$RUNNER_TEMP/rules-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_KEY" > "$key"
          python sign-bundle.py --rules rules.yar --private-key "$key" --version "$VERSION" --provenance 'Secure_Android original MIT heuristics' --output manifest.json
          python verify-bundle.py
          gh release create "rules-v$VERSION" manifest.json rules.yar rules-public-key.der --title "Reglas $VERSION" --notes 'Paquete firmado de heurísticas originales. No es un catálogo validado de familias de malware.' --latest
